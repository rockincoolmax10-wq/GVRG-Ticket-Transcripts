<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Transcripts</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --line: #d9dce1; --text: #1f2430; --muted: #646b78;
    --accent: #4f5bd5; --accent-text: #ffffff; --sel: #e8eaff; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c21; --panel: #23262d; --line: #363a43; --text: #e8eaee; --muted: #9aa1ae;
      --accent: #7782f0; --accent-text: #101225; --sel: #2c3050; --danger: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* password gate */
  .gate { height: 100%; display: grid; place-items: center; padding: 20px; }
  .gate form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 12px; }
  .gate h1 { margin: 0; font-size: 20px; }
  .gate p { margin: 0; color: var(--muted); }
  input[type=password], input[type=search] { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; padding: 9px 14px; font-weight: 600; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--danger); min-height: 1.4em; font-weight: 600; }

  /* app */
  .app { height: 100%; display: grid; grid-template-columns: 330px 1fr; }
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .side-head { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .side-head .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .side-head h1 { margin: 0; font-size: 16px; }
  .link { background: none; border: 0; color: var(--muted); padding: 4px 6px; border-radius: 4px; }
  .link:hover { color: var(--text); }
  .list { overflow-y: auto; flex: 1; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; }
  .item:hover { background: var(--bg); }
  .item.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .item b { display: block; }
  .item span { display: block; color: var(--muted); font-size: 13px; }
  .empty { padding: 20px 14px; color: var(--muted); }
  .viewer { position: relative; min-width: 0; min-height: 0; }
  .viewer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .viewer .placeholder, .viewer .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }
  .back { display: none; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .viewer { display: none; }
    .app.viewing .side { display: none; }
    .app.viewing .viewer { display: block; }
    .back { display: block; position: absolute; z-index: 2; top: 8px; left: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm">
    <h1>Ticket Transcripts</h1>
    <p>Enter the staff password to view transcripts.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
    <button class="primary" id="unlock" type="submit">Unlock</button>
    <div class="err" id="gateErr" role="alert"></div>
  </form>
</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="row">
        <h1>Transcripts</h1>
        <span>
          <button class="link" id="refresh" type="button">Refresh</button>
          <button class="link" id="lock" type="button">Lock</button>
        </span>
      </div>
      <input type="search" id="search" placeholder="Search ticket, user, category" aria-label="Search transcripts">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="viewer">
    <button class="back" id="back" type="button">Back to list</button>
    <div class="placeholder" id="placeholder">Select a transcript to view it.</div>
    <div class="loading hidden" id="loading">Loading transcript…</div>
    <iframe id="frame" class="hidden" title="Transcript"
      sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
  </main>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var key = null, entries = [], currentUrl = null, openId = null;
  var STORE = 'transcript-site-pw';

  function bust(url) { return url + '?t=' + Date.now(); }
  function fromHex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }

  async function fetchBytes(path) {
    var r = await fetch(bust(path), { cache: 'no-store' });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('Request failed (' + r.status + ')');
    return new Uint8Array(await r.arrayBuffer());
  }

  async function deriveKey(password) {
    var r = await fetch(bust('data/meta.json'), { cache: 'no-store' });
    if (r.status === 404) return { empty: true };
    if (!r.ok) throw new Error('Could not load site data (' + r.status + ')');
    var meta = await r.json();
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: fromHex(meta.salt), iterations: meta.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  async function unseal(bytes) {
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
    var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).arrayBuffer();
  }

  async function loadIndex() {
    var bytes = await fetchBytes('data/index.bin');
    if (!bytes) { entries = []; return; }
    entries = JSON.parse(new TextDecoder().decode(await unseal(bytes)));
  }

  async function unlock(password, silent) {
    $('gateErr').textContent = '';
    $('unlock').disabled = true;
    try {
      var k = await deriveKey(password);
      if (k.empty) { key = null; entries = []; }
      else { key = k; await loadIndex(); }
      try { sessionStorage.setItem(STORE, password); } catch (e) {}
      $('gate').classList.add('hidden');
      $('app').classList.remove('hidden');
      render();
      route();
    } catch (e) {
      if (e && e.name === 'OperationError') {
        try { sessionStorage.removeItem(STORE); } catch (x) {}
        if (!silent) $('gateErr').textContent = 'Wrong password.';
      } else if (!silent) {
        $('gateErr').textContent = 'Could not load transcripts: ' + e.message;
      }
      key = null;
    } finally { $('unlock').disabled = false; }
  }

  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('en-US', { timeZone: 'America/Chicago', dateStyle: 'medium', timeStyle: 'short' });
  }

  function render() {
    var q = $('search').value.trim().toLowerCase();
    var list = $('list');
    list.innerHTML = '';
    var shown = entries.filter(function (e) {
      return !q || [e.ticket, e.category, e.creator, e.closed_by].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    if (!shown.length) {
      var d = document.createElement('div');
      d.className = 'empty';
      d.textContent = entries.length ? 'No transcripts match your search.' : 'No transcripts yet. They appear here after a ticket transcript is saved.';
      list.appendChild(d);
      return;
    }
    shown.forEach(function (e) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item' + (e.id === openId ? ' sel' : '');
      var t = document.createElement('b'); t.textContent = 'Ticket #' + String(e.ticket).padStart(4, '0');
      var a = document.createElement('span'); a.textContent = e.category + ' from ' + e.creator;
      var c = document.createElement('span'); c.textContent = 'Closed by ' + e.closed_by + ', ' + fmt(e.closed_at || e.saved_at);
      b.append(t, a, c);
      b.addEventListener('click', function () { location.hash = e.id; });
      list.appendChild(b);
    });
  }

  async function view(id) {
    var e = entries.find(function (x) { return x.id === id; });
    if (!e || !key) return;
    openId = id;
    render();
    $('app').classList.add('viewing');
    $('placeholder').classList.add('hidden');
    $('frame').classList.add('hidden');
    $('loading').textContent = 'Loading transcript…';
    $('loading').classList.remove('hidden');
    try {
      var bytes = await fetchBytes('data/t/' + id + '.bin');
      if (!bytes) throw new Error('This transcript file is missing (it may still be deploying; try again in a minute).');
      var html = await unseal(bytes);
      if (openId !== id) return;
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      // Original HTML, unmodified, shown in a sandboxed frame.
      currentUrl = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
      $('frame').src = currentUrl;
      $('frame').classList.remove('hidden');
      $('loading').classList.add('hidden');
      document.title = 'Ticket #' + e.ticket + ' · Transcripts';
    } catch (err) {
      $('loading').textContent = 'Could not open transcript: ' + err.message;
    }
  }

  function route() {
    var id = location.hash.replace(/^#/, '');
    if (id) { view(id); }
    else {
      openId = null; render();
      $('app').classList.remove('viewing');
      $('frame').classList.add('hidden'); $('loading').classList.add('hidden');
      $('placeholder').classList.remove('hidden');
      document.title = 'Ticket Transcripts';
    }
  }

  $('gateForm').addEventListener('submit', function (ev) { ev.preventDefault(); unlock($('pw').value, false); });
  $('search').addEventListener('input', render);
  $('back').addEventListener('click', function () { location.hash = ''; });
  window.addEventListener('hashchange', function () { if (key) route(); });
  $('refresh').addEventListener('click', async function () {
    try { await loadIndex(); } catch (e) {}
    render();
  });
  $('lock').addEventListener('click', function () {
    try { sessionStorage.removeItem(STORE); } catch (e) {}
    key = null; entries = []; openId = null;
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    $('frame').removeAttribute('src');
    $('app').classList.add('hidden'); $('gate').classList.remove('hidden');
    $('pw').value = '';
  });

  // Reopen without asking again during the same browser tab session.
  try {
    var saved = sessionStorage.getItem(STORE);
    if (saved) unlock(saved, true);
  } catch (e) {}
})();
</script>
</body>
</html>
